      <aside aria-label="About BetterKabugao">
        <h2>BetterKabugao.org</h2>
        <p>This site works without JavaScript: every page is delivered as complete HTML, so the text above is the whole page and not a truncated shell. What JavaScript adds is the interactive map, the live weather reading, and the search and filter boxes.</p>
        <p>Kabugao is the capital of Apayao. It has 21 barangays and 16,425 residents (2024 POPCEN) across 935.12 km², and is a 1st-class municipality, PSGC 1408104000.</p>
        <p>Being built: more source-linked records, plain-language guides to municipal services, and documentation of Kabugao's places, heritage and culture. Nothing is published until it can be traced to an official source.</p>
        <p>Cost to the people of Kabugao: ₱0. Cost to build this site: ₱670, paid personally by the developer.</p>
        <p>BetterKabugao is an independent, volunteer-run civic project. It is not the official website of the Municipality of Kabugao.</p>
        <p>Built by Robin Tapiru. <a href="https://github.com/KuyaLoy/betterkabugao" rel="noreferrer">View the repository on GitHub</a>.</p>
