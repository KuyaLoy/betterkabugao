        <h1>BetterKabugao.org</h1>
        <p>Coming soon — a volunteer-run civic portal for Kabugao, the capital of Apayao.</p>
        <p>Kabugao has 21 barangays and 16,215 residents (2020 census) across 935.12 km².</p>
        <p>Being built: a public record of local projects (flood control, roads, bridges, drainage, water systems) with budget, funding source and contractor; guides to municipal services; and documentation of Kabugao's places, heritage and culture.</p>
        <p>Cost to the people of Kabugao: ₱0. Cost to build this site: ₱670, paid personally by the developer.</p>
        <p>BetterKabugao is an independent, volunteer-run civic project. It is not the official website of the Municipality of Kabugao.</p>
        <p>Built by Robin Tapiru. <a href="https://github.com/KuyaLoy/betterkabugao" rel="noreferrer">View the repository on GitHub</a>.</p>
